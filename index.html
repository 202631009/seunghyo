        /* 판돈 중앙 */
        .pot-area {
            text-align: center;

        /* 컨트롤 및 베팅 버튼 */
        .controls {

        .btn {

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;

        .btn-start { background: #22c55e; color: white; font-size: 1.3rem; width: 100%; max-width: 300px; }
        .btn-start:hover:not(:disabled) { background: #16a34a; transform: translateY(-2px); }

        .btn-call { background: #3b82f6; color: white; }
        .btn-call:hover:not(:disabled) { background: #2563eb; transform: translateY(-2px); }

        .btn-raise:hover:not(:disabled) { background: #ca8a04; transform: translateY(-2px); }

        .btn-die { background: #ef4444; color: white; }
        .btn-die:hover:not(:disabled) { background: #dc2626; transform: translateY(-2px); }

        /* 결과 overlay 메시지 */
        .message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            border: 3px solid #fbbf24;
            border-radius: 24px;
            padding: 30px 40px;
            text-align: center;
            z-index: 100;
            display: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            width: 85%;
            max-width: 400px;
        }

        .message-box h2 {
            font-family: 'Jua', sans-serif;
            font-size: 2.2rem;
            color: #fbbf24;
            margin-bottom: 10px;
        }

        .message-box p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #cbd5e1;
        }

        .message-box .btn {
            background: #fbbf24;
            color: #0f172a;
            width: 100%;
        }

        .pop-animation {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="board">
        <!-- 상단 헤더 -->
        <div class="game-header">
            <div class="title">🎴 한판 섯다</div>
            <div class="money-info">
                <div class="money-tag">컴퓨터: <span id="ai-money" class="money-val">100,000</span>원</div>
                <div class="money-tag">내 잔액: <span id="player-money" class="money-val">100,000</span>원</div>
            </div>
        </div>

        <!-- AI 영역 -->
        <div class="player-area">
            <div class="area-label">🤖 컴퓨터 (상대)</div>
            <div class="cards-wrapper" id="ai-cards">
                <div class="card back"></div>
                <div class="card back"></div>
            </div>
            <div class="jokbo-badge" id="ai-jokbo"></div>
        </div>

        <!-- 판돈 표시 -->
        <div class="pot-area">
            💰 현재 판돈: <span id="pot-money" style="color: #4ade80;">0</span>원
        </div>

        <!-- 플레이어 영역 -->
        <div class="player-area">
            <div class="area-label">👤 나 (플레이어)</div>
            <div class="cards-wrapper" id="player-cards">
                <div class="card back"></div>
                <div class="card back"></div>
            </div>
            <div class="jokbo-badge" id="player-jokbo">게임 시작 버튼을 눌러주세요</div>
        </div>

        <!-- 컨트롤 버튼 -->
        <div class="controls">
            <button id="btn-start" class="btn btn-start" onclick="startGame()">게임 시작 (기본판돈 5,000원)</button>
            <button id="btn-call" class="btn btn-call" onclick="playerAction('call')" disabled>콜 (Call)</button>
            <button id="btn-raise" class="btn btn-raise" onclick="playerAction('raise')" disabled>레이즈 (+10,000원)</button>
            <button id="btn-die" class="btn btn-die" onclick="playerAction('die')" disabled>다이 (Die)</button>
        </div>

        <!-- 결과 모달 메시지 -->
        <div id="message-box" class="message-box">
            <h2 id="msg-title">승리!</h2>
            <p id="msg-desc">상대보다 높은 족보입니다.</p>
            <button class="btn" onclick="closeMessage()">확인</button>
        </div>
    </div>

    <script>
        // 화투 20장 데이터 정의
        const DECK_DATA = [
            { id: 1, month: 1, type: 'kwang', name: '1월 광', icon: '☀️' },
            { id: 2, month: 1, type: 'pi', name: '1월 피', icon: '🌲' },
            { id: 3, month: 2, type: 'yeol', name: '2월 꾀꼬리', icon: '🐦' },
            { id: 4, month: 2, type: 'pi', name: '2월 피', icon: '🌸' },
            { id: 5, month: 3, type: 'kwang', name: '3월 광', icon: '🌸' },
            { id: 6, month: 3, type: 'pi', name: '3월 피', icon: '🍃' },
            { id: 7, month: 4, type: 'yeol', name: '4월 흑싸리', icon: '🌿' },
            { id: 8, month: 4, type: 'pi', name: '4월 피', icon: '🌱' },
            { id: 9, month: 5, type: 'yeol', name: '5월 난초', icon: '🌾' },
            { id: 10, month: 5, type: 'pi', name: '5월 피', icon: '🍃' },
            { id: 11, month: 6, type: 'yeol', name: '6월 모란', icon: '🦋' },
            { id: 12, month: 6, type: 'pi', name: '6월 피', icon: '🌺' },
            { id: 13, month: 7, type: 'yeol', name: '7월 멧돼지', icon: '🐗' },
            { id: 14, month: 7, type: 'pi', name: '7월 피', icon: '🌿' },
            { id: 15, month: 8, type: 'kwang', name: '8월 광', icon: '🌕' },
            { id: 16, month: 8, type: 'pi', name: '8월 피', icon: '🌾' },
            { id: 17, month: 9, type: 'yeol', name: '9월 국준', icon: '🍶' },
            { id: 18, month: 9, type: 'pi', name: '9월 피', icon: '🌼' },
            { id: 19, month: 10, type: 'yeol', name: '10월 사슴', icon: '🦌' },
            { id: 20, month: 10, type: 'pi', name: '10월 피', icon: '🍁' }
        ];

        // 게임 상태 변수
        let playerMoney = 100000;
        let aiMoney = 100000;
        let potMoney = 0;
        let baseBet = 5000;
        let currentDeck = [];
        let playerCards = [];
        let aiCards = [];
        let isReMatch = false;

        // 음수 방지 및 화폐 포맷
        function formatMoney(num) {
            return num.toLocaleString();
        }

        function updateUI() {
            document.getElementById('player-money').textContent = formatMoney(playerMoney);
            document.getElementById('ai-money').textContent = formatMoney(aiMoney);
            document.getElementById('pot-money').textContent = formatMoney(potMoney);
        }

        // 족보 계산 로직
        function evaluateJokbo(card1, card2) {
            const m1 = card1.month;
            const m2 = card2.month;
            const isK1 = card1.type === 'kwang';
            const isK2 = card2.type === 'kwang';

            // 1. 광땡
            if (isK1 && isK2) {
                if ((m1 === 3 && m2 === 8) || (m1 === 8 && m2 === 3)) return { score: 1000, name: '38광땡 👑' };
                if ((m1 === 1 && m2 === 3) || (m1 === 3 && m2 === 1)) return { score: 990, name: '13광땡 ✨' };
                if ((m1 === 1 && m2 === 8) || (m1 === 8 && m2 === 1)) return { score: 980, name: '18광땡 ✨' };
            }

            // 2. 땡 (같은 월 2장)
            if (m1 === m2) {
                return { score: 800 + m1, name: `${m1 === 10 ? '장땡' : m1 + '땡'} 🔥` };
            }

            // 3. 특수 족보 (알리, 독사, 구핑, 장빙, 장사, 세륙)
            const months = [m1, m2].sort((a, b) => a - b);
            const key = `${months[0]}-${months[1]}`;

            const specialJokbo = {
                '1-2': { score: 700, name: '알리 🐍' },
                '1-4': { score: 690, name: '독사 🐍' },
                '1-9': { score: 680, name: '구핑 🎯' },
                '1-10': { score: 670, name: '장빙 ❄️' },
                '4-10': { score: 660, name: '장사 🏹' },
                '4-6': { score: 650, name: '세륙 🎲' }
            };

            if (specialJokbo[key]) {
                return specialJokbo[key];
            }

            // 4. 특수 잡이/구사 패 처리
            // 암행어사 (4월 열 + 7월 열)
            if ((card1.id === 7 && card2.id === 13) || (card1.id === 13 && card2.id === 7)) {
                return { score: 1, name: '암행어사 🗡️ (광땡 잡이/1끗)', isSecretAgent: true };
            }
            // 땡잡이 (3월 광 + 7월 열)
            if ((card1.id === 5 && card2.id === 13) || (card1.id === 13 && card2.id === 5)) {
                return { score: 0, name: '땡잡이 🎯 (9땡 이하 잡이/망통)', isDdaengCatcher: true };
            }
            // 구사 (4월 + 9월)
            if (key === '4-9') {
                return { score: 0, name: '구사 🔄 (알리 이하 재경기)', isGusa: true };
            }

            // 5. 끗 (합의 일의 자리)
            const gkut = (m1 + m2) % 10;
            if (gkut === 9) return { score: 100 + gkut, name: '갑오 (9끗) 👍' };
            if (gkut === 0) return { score: 100, name: '망통 (0끗) 💩' };
            return { score: 100 + gkut, name: `${gkut}끗` };
        }

        // 덱 셔플 및 판돈 초기화
        function startGame() {
            if (playerMoney < baseBet || aiMoney < baseBet) {
                alert('잔액이 부족합니다! 판돈을 가질 수 없어 새로 시작합니다.');
                playerMoney = 100000;
                aiMoney = 100000;
            }

            if (!isReMatch) {
                potMoney = baseBet * 2;
                playerMoney -= baseBet;
                aiMoney -= baseBet;
            } else {
                isReMatch = false; // 재경기 후 초기화
            }

            updateUI();

            // 덱 섞기
            currentDeck = [...DECK_DATA].sort(() => Math.random() - 0.5);

            playerCards = [currentDeck.pop(), currentDeck.pop()];
            aiCards = [currentDeck.pop(), currentDeck.pop()];

            // 카드 보이기 (플레이어 카드 전면, AI 카드 후면)
            renderCards('player-cards', playerCards, true);
            renderCards('ai-cards', aiCards, false);

            const playerJokbo = evaluateJokbo(playerCards[0], playerCards[1]);
            document.getElementById('player-jokbo').textContent = `내 족보: ${playerJokbo.name}`;
            document.getElementById('ai-jokbo').textContent = `---`;

            // 버튼 활성화
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-call').disabled = false;
            document.getElementById('btn-raise').disabled = false;
            document.getElementById('btn-die').disabled = false;
        }

        // 카드 랜더링
        function renderCards(elementId, cards, showFront) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';

            cards.forEach(card => {
                const cardDiv = document.createElement('div');
                if (showFront) {
                    cardDiv.className = `card front pop-animation`;
                    cardDiv.innerHTML = `
                        <div class="card-month">${card.month}월</div>
                        <div class="card-icon">${card.icon}</div>
                        <div class="card-type ${card.type}">${card.type === 'kwang' ? '光' : card.type === 'yeol' ? '열' : '피'}</div>
                    `;
                } else {
                    cardDiv.className = `card back`;
                }
                container.appendChild(cardDiv);
            });
        }

        // 베팅 액션
        function playerAction(action) {
            if (action === 'die') {
                aiMoney += potMoney;
                showMessage('패배 😭', `다이하셨습니다. 컴퓨터가 판돈 ${formatMoney(potMoney)}원을 획득했습니다.`);
                resetGameAfterRound();
                return;
            }

            let betAmount = 10000;

            if (action === 'raise') {
                if (playerMoney < betAmount * 2) {
                    alert('잔액이 부족하여 레이즈 할 수 없습니다!');
                    return;
                }
                playerMoney -= betAmount * 2;
                aiMoney -= betAmount;
                potMoney += betAmount * 3;
            } else if (action === 'call') {
                if (playerMoney < betAmount) {
                    alert('잔액이 부족합니다!');
                    return;
                }
                playerMoney -= betAmount;
                aiMoney -= betAmount;
                potMoney += betAmount * 2;
            }

            updateUI();
            showResult();
        }

        // 결과 비교 및 판정
        function showResult() {
            renderCards('ai-cards', aiCards, true); // AI 카드 공개

            let pJokbo = evaluateJokbo(playerCards[0], playerCards[1]);
            let aJokbo = evaluateJokbo(aiCards[0], aiCards[1]);

            document.getElementById('ai-jokbo').textContent = `상대 족보: ${aJokbo.name}`;

            // 특수 족보 잡기 로직 적용
            // 1. 암행어사: 13, 18광땡 잡기 (38광땡 제외)
            if (pJokbo.isSecretAgent && (aJokbo.score === 990 || aJokbo.score === 980)) {
                pJokbo.score = 2000; // 승리 확정
            }
            if (aJokbo.isSecretAgent && (pJokbo.score === 990 || pJokbo.score === 980)) {
                aJokbo.score = 2000;
            }

            // 2. 땡잡이: 1땡~9땡 잡기 (장땡, 광땡 제외)
            if (pJokbo.isDdaengCatcher && (aJokbo.score >= 801 && aJokbo.score <= 809)) {
                pJokbo.score = 1500;
            }
            if (aJokbo.isDdaengCatcher && (pJokbo.score >= 801 && pJokbo.score <= 809)) {
                aJokbo.score = 1500;
            }

            // 3. 구사: 알리 이하 판돈 이월 재경기
            if ((pJokbo.isGusa && aJokbo.score <= 700) || (aJokbo.isGusa && pJokbo.score <= 700)) {
                isReMatch = true;
                showMessage('구사! 🔄 (재경기)', `상대와 나의 족보가 알리 이하이므로 구사가 성립되었습니다! 판돈(${formatMoney(potMoney)}원)을 이월하고 재경기를 시작합니다.`);
                resetGameAfterRound();
                return;
            }

            // 승패 판정
            setTimeout(() => {
                if (pJokbo.score > aJokbo.score) {
                    playerMoney += potMoney;
                    showMessage('승리! 🎉', `나 [${pJokbo.name}] vs 상대 [${aJokbo.name}]<br>판돈 <strong>${formatMoney(potMoney)}원</strong>을 획득하셨습니다!`);
                } else if (pJokbo.score < aJokbo.score) {
                    aiMoney += potMoney;
                    showMessage('패배 😭', `나 [${pJokbo.name}] vs 상대 [${aJokbo.name}]<br>상대가 <strong>${formatMoney(potMoney)}원</strong>을 가져갑니다.`);
                } else {
                    // 무승부 (동점) -> 재경기
                    isReMatch = true;
                    showMessage('무승부 (동점) 🤝', `동일한 족보입니다 [${pJokbo.name}]! 판돈(${formatMoney(potMoney)}원)을 이월하여 재경기를 진행합니다.`);
                }
                resetGameAfterRound();
            }, 600);
        }

        function showMessage(title, desc) {
            document.getElementById('msg-title').innerHTML = title;
            document.getElementById('msg-desc').innerHTML = desc;
            document.getElementById('message-box').style.display = 'block';
        }

        function closeMessage() {
            document.getElementById('message-box').style.display = 'none';
        }

        function resetGameAfterRound() {
            if (!isReMatch) {
                potMoney = 0;
            }
            updateUI();
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-call').disabled = true;
            document.getElementById('btn-raise').disabled = true;
            document.getElementById('btn-die').disabled = true;
