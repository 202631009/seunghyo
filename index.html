<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>섯다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --felt:#0F5B33; --felt-dark:#0A4225;
    --card:#FFF8EC; --ink:#231F1A; --ink-soft:#6b6259;
    --gold:#E8BA4B; --gold-deep:#B4842A;
    --red:#D0453A; --line:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-dark) 100%);
    color:#fff;font-family:'Noto Sans KR',sans-serif;min-height:100vh;}
  h1,.title-font{font-family:'Black Han Sans',sans-serif;font-weight:400;}
  #app{max-width:640px;margin:0 auto;padding:16px 14px 60px;}
  header{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 14px;}
  header h1{font-size:26px;margin:0;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.3);}
  .pot{background:rgba(0,0,0,.28);border:1px solid var(--gold-deep);border-radius:14px;padding:6px 14px;font-size:14px;}
  .pot b{color:var(--gold);font-family:'Black Han Sans',sans-serif;font-size:16px;}

  .ai-row{display:flex;gap:8px;margin-bottom:14px;}
  .ai-card{flex:1;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;position:relative;transition:box-shadow .2s;}
  .ai-card.acting{box-shadow:0 0 0 2px var(--gold);}
  .ai-card .name{font-size:13px;font-weight:700;}
  .ai-card .chips{font-size:11.5px;color:var(--gold);margin:2px 0 6px;}
  .ai-card .hand{display:flex;gap:3px;justify-content:center;}
  .ai-card .status{font-size:11px;margin-top:6px;color:#ffd6d0;min-height:14px;}
  .ai-card.folded{opacity:.4;}

  .mini-card{width:22px;height:30px;background:linear-gradient(135deg,#2c3e6b,#1a2444);border-radius:4px;border:1px solid rgba(255,255,255,.3);}
  .mini-card.revealed{background:var(--card);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--ink);font-weight:700;}

  .table-center{text-align:center;margin:10px 0 18px;font-size:13px;color:#d9e8de;min-height:20px;}

  .user-area{background:rgba(0,0,0,.24);border:1px solid var(--line);border-radius:18px;padding:16px;}
  .user-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .user-top .chips{color:var(--gold);font-family:'Black Han Sans',sans-serif;font-size:18px;}
  .hand-area{display:flex;gap:10px;justify-content:center;margin-bottom:12px;}
  .card{width:64px;height:90px;background:var(--card);border-radius:8px;box-shadow:0 6px 14px rgba(0,0,0,.35);
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);position:relative;}
  .card .month{font-size:22px;font-weight:900;}
  .card .kind{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .card.gwang{border:2px solid var(--gold-deep);}
  .card.gwang::after{content:'광';position:absolute;top:4px;right:6px;font-size:11px;color:var(--gold-deep);font-weight:900;}

  .result-line{text-align:center;font-family:'Black Han Sans',sans-serif;font-size:19px;color:var(--gold);margin-bottom:10px;min-height:24px;}

  .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .btn{appearance:none;border:none;border-radius:999px;padding:12px 20px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:transform .1s;}
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn-call{background:var(--gold);color:#3a2a00;}
  .btn-raise{background:#3f7fd6;color:#fff;}
  .btn-die{background:var(--red);color:#fff;}
  .btn-primary{background:var(--gold);color:#3a2a00;}
  .btn-ghost{background:rgba(255,255,255,.12);color:#fff;}
  .btn-full{width:100%;padding:16px;font-size:17px;}

  .log{margin-top:16px;background:rgba(0,0,0,.28);border-radius:12px;padding:10px 14px;font-size:12.5px;
    color:#cfe3d6;max-height:110px;overflow-y:auto;}
  .log div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.06);}
  .rules{margin-top:14px;font-size:11.5px;color:#bcd6c4;line-height:1.6;text-align:center;}

  #startScreen{text-align:center;padding:60px 10px 20px;}
  #startScreen h1{font-size:44px;}
  #startScreen p{color:#d9e8de;font-size:14.5px;max-width:380px;margin:10px auto 26px;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">

  <div id="startScreen">
    <h1>🎴 섯다</h1>
    <p>화투 두 장으로 족보를 겨루는 전통 카드게임. AI 3명과 가상 칩으로 대결해요. (실제 돈은 오가지 않아요)</p>
    <button class="btn btn-primary btn-full" style="max-width:220px" onclick="startGame()">게임 시작</button>
  </div>

  <div id="gameScreen" class="hidden">
    <header>
      <h1 class="title-font">🎴 섯다</h1>
      <div class="pot">판돈 <b id="potAmt">0</b></div>
    </header>

    <div class="ai-row" id="aiRow"></div>
    <div class="table-center" id="centerMsg"></div>

    <div class="user-area">
      <div class="user-top">
        <span>나</span>
        <span class="chips" id="userChips">0 칩</span>
      </div>
      <div class="hand-area" id="userHand"></div>
      <div class="result-line" id="resultLine"></div>
      <div class="actions" id="actionArea"></div>
    </div>

    <div class="log" id="logArea"></div>
    <div class="rules">족보 순위(낮음→높음): 끗(0~9) &lt; 세육·장삥·구삥·독사·알리 &lt; 땡 &lt; 광땡 · 광땡/땡으로 승리하면 판돈이 두 배로 커져요(싹쓸이)</div>
  </div>

</div>

<script>
/* ============ constants ============ */
const ANTE = 50;
const START_CHIPS = 2000;
const RAISE_STEP = 100;
const MAX_RAISES = 3;
const GWANG_MONTHS = [1,3,8,11,12];

let players = [];   // {id,name,isUser,chips,cards,folded,contributed,isAI}
let deck = [];
let pot = 0;
let currentBet = 0;
let raiseCount = 0;
let turnOrder = [];
let turnIdx = 0;
let phase = 'idle'; // betting | showdown

/* ============ setup ============ */
function buildDeck(){
  const d = [];
  for(let m=1;m<=12;m++){
    for(let i=0;i<4;i++){
      d.push({month:m, isGwang: i===0 && GWANG_MONTHS.includes(m)});
    }
  }
  for(let i=d.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [d[i],d[j]]=[d[j],d[i]];
  }
  return d;
}

function startGame(){
  players = [
    {id:0, name:'나', isUser:true, isAI:false, chips:START_CHIPS, cards:[], folded:false, contributed:0},
    {id:1, name:'민수', isAI:true, chips:START_CHIPS, cards:[], folded:false, contributed:0},
    {id:2, name:'지영', isAI:true, chips:START_CHIPS, cards:[], folded:false, contributed:0},
    {id:3, name:'철수', isAI:true, chips:START_CHIPS, cards:[], folded:false, contributed:0},
  ];
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  log('게임을 시작합니다. 참가자 전원 ' + START_CHIPS + '칩으로 시작!');
  newHand();
}

function newHand(){
  const alive = players.filter(p=>p.chips>0);
  if(alive.length < 2){
    centerMsg(players[0].chips>0 ? '🏆 최후의 1인! 당신이 판을 쓸었습니다.' : '💸 칩을 모두 잃었습니다. 게임 오버.');
    document.getElementById('actionArea').innerHTML = `<button class="btn btn-primary btn-full" onclick="location.reload()">다시 시작</button>`;
    return;
  }
  deck = buildDeck();
  pot = 0; currentBet = ANTE; raiseCount = 0;
  players.forEach(p=>{
    p.cards = []; p.folded = p.chips<=0; p.contributed = 0; p.actedThisRound = false;
  });
  // ante
  players.forEach(p=>{
    if(p.folded) return;
    const pay = Math.min(ANTE, p.chips);
    p.chips -= pay; p.contributed = pay; pot += pay;
  });
  // deal
  players.forEach(p=>{ if(!p.folded){ p.cards=[deck.pop(), deck.pop()]; }});
  document.getElementById('resultLine').textContent='';
  centerMsg('참가비 ' + ANTE + '칩씩 걷고 두 장씩 나눠드렸어요.');
  renderAll(false);
  phase = 'betting';
  turnOrder = players.filter(p=>!p.folded).map(p=>p.id);
  turnIdx = 0;
  setTimeout(()=>advanceTurn(), 500);
}

/* ============ hand evaluation ============ */
function evaluateHand(cards){
  const [c1,c2] = cards;
  const m1=c1.month, m2=c2.month;
  if(c1.isGwang && c2.isGwang){
    const set=[m1,m2].sort((a,b)=>a-b);
    if(set.includes(3) && set.includes(8)) return {score:1030,label:'3광땡'};
    if(set.includes(8)) return {score:1020,label:'8광땡'};
    return {score:1000+set[0], label:'광땡'};
  }
  if(m1===m2){
    return {score:800+m1, label: (m1===10?'장땡':m1+'땡')};
  }
  const set=[m1,m2].sort((a,b)=>a-b).join(',');
  const specials = {
    '1,2':{score:714,label:'알리'}, '1,4':{score:713,label:'독사'},
    '1,9':{score:712,label:'구삥'}, '1,10':{score:711,label:'장삥'},
    '4,6':{score:710,label:'세육'}
  };
  if(specials[set]) return specials[set];
  const kkeut = (m1+m2)%10;
  const label = kkeut===0 ? '망통' : (kkeut===9 ? '갑오' : kkeut+'끗');
  return {score:kkeut, label};
}

/* ============ betting loop ============ */
function activePlayers(){ return players.filter(p=>!p.folded); }

function advanceTurn(){
  const active = activePlayers();
  if(active.length===1){ return showdown(); }
  if(turnOrder.filter(id=>{
      const p = players.find(pp=>pp.id===id);
      return !p.folded;
    }).length===0){ return; }

  // find next active player needing to act (contributed < currentBet, or hasn't acted this round when currentBet is 0)
  let attempts = 0;
  while(attempts < turnOrder.length){
    const p = players.find(pp=>pp.id===turnOrder[turnIdx % turnOrder.length]);
    turnIdx++;
    attempts++;
    if(p.folded || p.chips===0) continue;
    if(p.contributed < currentBet || !p.actedThisRound){
      p.actedThisRound = true;
      if(p.isUser){ renderAll(false); return promptUser(p); }
      return setTimeout(()=>aiAct(p), 700);
    }
  }
  // everyone matched -> showdown
  showdown();
}

function promptUser(p){
  const canRaise = raiseCount < MAX_RAISES && p.chips > (currentBet-p.contributed);
  const callAmt = currentBet - p.contributed;
  document.getElementById('actionArea').innerHTML = `
    <button class="btn btn-call" onclick="userAction('call')">${callAmt<=0?'체크':'콜 ('+callAmt+')'}</button>
    <button class="btn btn-raise" ${canRaise?'':'disabled'} onclick="userAction('raise')">레이즈 (+${RAISE_STEP})</button>
    <button class="btn btn-die" onclick="userAction('die')">다이</button>
  `;
  centerMsg('당신 차례예요. 콜 / 레이즈 / 다이 중 선택하세요.');
}

function userAction(type){
  const p = players.find(pp=>pp.isUser);
  applyAction(p, type);
  document.getElementById('actionArea').innerHTML = '';
  renderAll(false);
  setTimeout(()=>advanceTurn(), 400);
}

function aiAct(p){
  const {score} = evaluateHand(p.cards);
  const callAmt = currentBet - p.contributed;
  let type;
  const bluff = Math.random() < 0.08;
  if(score >= 800 || bluff){ // 땡 이상, 혹은 가끔 블러핑
    type = (raiseCount < MAX_RAISES && Math.random()<0.6) ? 'raise' : 'call';
  } else if(score >= 700){ // 특수족보
    type = Math.random()<0.75 ? 'call' : 'die';
  } else if(score >= 5){
    type = Math.random()<0.5 ? 'call' : 'die';
  } else {
    type = (callAmt===0 && Math.random()<0.5) ? 'call' : 'die';
  }
  if(callAmt > p.chips && type!=='die'){ type = p.chips>0 ? 'call' : 'die'; }
  applyAction(p, type);
  renderAll(false);
  setTimeout(()=>advanceTurn(), 500);
}

function applyAction(p, type){
  if(type==='die'){
    p.folded = true;
    log(p.name + ' 다이 😵');
    centerMsg(p.name + '님이 다이했어요.');
    return;
  }
  if(type==='call'){
    const need = Math.min(currentBet - p.contributed, p.chips);
    p.chips -= need; p.contributed += need; pot += need;
    log(p.name + ' 콜 (' + need + '칩)');
    centerMsg(p.name + '님이 콜했어요.');
    return;
  }
  if(type==='raise'){
    raiseCount++;
    const target = currentBet + RAISE_STEP;
    const need = Math.min(target - p.contributed, p.chips);
    p.chips -= need; p.contributed += need; pot += need;
    currentBet = Math.max(currentBet, p.contributed);
    players.forEach(pp=>{ if(pp.id!==p.id) pp.actedThisRound = false; });
    log(p.name + ' 레이즈! 판돈 ' + currentBet + '칩으로 상승 🔥');
    centerMsg(p.name + '님이 레이즈했어요!');
  }
}

/* ============ showdown ============ */
function showdown(){
  phase='showdown';
  const active = activePlayers();
  active.forEach(p=> p.eval = evaluateHand(p.cards));
  let best = active[0];
  active.forEach(p=>{ if(p.eval.score > best.eval.score) best = p; });
  const winners = active.filter(p=>p.eval.score===best.eval.score);

  const sweep = best.eval.score >= 800; // 땡 이상이면 싹쓸이(판돈 2배)
  let totalPot = pot;
  if(sweep){
    players.forEach(p=>{
      if(!winners.includes(p) && p.contributed>0 && p.chips>0){
        const extra = Math.min(p.chips, ANTE);
        p.chips -= extra; totalPot += extra;
      }
    });
  }

  const share = Math.floor(totalPot / winners.length);
  winners.forEach(w=> w.chips += share);

  renderAll(true);
  const you = players.find(p=>p.isUser);
  const winNames = winners.map(w=>w.name).join(', ');
  document.getElementById('resultLine').textContent =
    `${winNames} 승! (${best.eval.label})` + (sweep ? ' — 싹쓸이! 판돈 2배 🎉' : '');
  centerMsg(winners.includes(you) ? '축하해요, 이번 판을 가져갔어요!' : (you.folded ? '다음 판을 노려봐요.' : '아쉽지만 이번엔 졌어요.'));
  log('▶ 결과: ' + active.map(p=>p.name+' '+p.eval.label).join(' / ') + ' → 승자 ' + winNames);

  document.getElementById('actionArea').innerHTML =
    `<button class="btn btn-primary btn-full" onclick="newHand()">다음 판</button>`;
}

/* ============ rendering ============ */
function cardHTML(c, revealed){
  if(!revealed) return `<div class="mini-card"></div>`;
  return `<div class="mini-card revealed">${c.month}</div>`;
}
function bigCardHTML(c){
  return `<div class="card ${c.isGwang?'gwang':''}"><span class="month">${c.month}</span><span class="kind">${c.isGwang?'광':'월'}</span></div>`;
}

function renderAll(showAI){
  const you = players.find(p=>p.isUser);
  document.getElementById('userChips').textContent = you.chips + ' 칩';
  document.getElementById('potAmt').textContent = pot;
  document.getElementById('userHand').innerHTML = you.cards.map(bigCardHTML).join('');

  document.getElementById('aiRow').innerHTML = players.filter(p=>p.isAI).map(p=>{
    const evalTxt = showAI && !p.folded ? evaluateHand(p.cards).label : '';
    return `<div class="ai-card ${p.folded?'folded':''}">
      <div class="name">${p.name}</div>
      <div class="chips">${p.chips}칩</div>
      <div class="hand">${p.cards.map(c=>cardHTML(c, showAI)).join('')}</div>
      <div class="status">${p.folded?'다이':evalTxt}</div>
    </div>`;
  }).join('');
}
function centerMsg(t){ document.getElementById('centerMsg').textContent = t; }
function log(t){
  const el = document.getElementById('logArea');
  const row = document.createElement('div');
  row.textContent = t;
  el.prepend(row);
  while(el.children.length>30) el.removeChild(el.lastChild);
}
</script>
</body>
</html>
